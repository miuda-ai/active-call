[package]
edition = "2024"
name = "active-call"
version = "0.3.96"
authors = ["jinti<shenjindi@fourz.cn>"]
build = false
exclude = [
    "fixtures/**",
    "examples/**",
    "src/media/tests/**",
    "tests/**",
    "scripts/**",
    "docs/**",
    "config/**",
    "features/**",
    "static/**",
    "dialogue.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A SIP/WebRTC voice agent"
readme = "README.md"
keywords = [
    "sip",
    "voip",
    "telephony",
    "voice-agent",
    "webrtc",
]
categories = [
    "network-programming",
    "multimedia",
]
license = "MIT"
repository = "https://github.com/miuda-ai/active-call"

[features]
cross = [
    "offline",
    "aws-lc-rs/bindgen",
]
default = ["offline"]
not_vad = []
offline = [
    "dep:knf-rs-sys",
    "dep:ort",
    "dep:hf-hub",
    "dep:ndarray",
]
opus = []
ringback-detection = ["dep:lele"]

[lib]
name = "active_call"
path = "src/lib.rs"

[[bin]]
name = "active-call"
path = "src/main.rs"

