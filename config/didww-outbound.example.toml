# DIDWW outbound calls: use the existing WebSocket invite command.
# Supply digest credentials per call, not through SIP REGISTER.
# Replace YOUR_PUBLIC_IP before starting. See docs/didww_integration.md.
addr = "0.0.0.0"
udp_port = 5060
http_addr = "127.0.0.1:8080"
external_ip = "YOUR_PUBLIC_IP"
rtp_bind_ip = "0.0.0.0"
rtp_start_port = 16000
rtp_end_port = 16100
codecs = ["pcmu", "pcma"]
enable_srtp = false
media_cache_path = "./config/mediacache"
